[env:esp32-s3-epaper]
; PlatformIO's official "espressif32" platform is stuck on arduino-esp32 core
; 2.0.17 (ESP-IDF 4.4-based) -- missing headers like driver/i2c_master.h and
; esp_vfs_fat_info() that only exist in the ESP-IDF 5.x-based core. The
; Arduino IDE install this project used to use has core 3.3.10, so pin to
; the pioarduino community fork instead, which tracks current Arduino-esp32
; releases (this pin bundles core 3.3.9, closest available match). Verify
; https://github.com/pioarduino/platform-espressif32/releases before bumping.
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

; NimBLE-Arduino replaces the classic Bluedroid-based Arduino BLE library
; that ble_sync.cpp used to use (BLEDevice/BLEServer/BLECharacteristic) --
; switched to unlock L2CAP CoC support for a future BLE speed upgrade.
; Bluedroid and NimBLE are mutually exclusive host stacks (can't run both
; on the same radio), so this is a full swap, not an addition -- there's
; no separate flag to "disable" the classic library since it was never
; listed here as a lib_dep, only reached via #include <BLEDevice.h>, which
; ble_sync.cpp no longer does. Pinned to an exact version (not a caret
; range) so a future `pio pkg update` can't silently change API surface
; under a working build -- verify this is still the current version at
; https://registry.platformio.org/libraries/h2zero/NimBLE-Arduino before
; bumping it, don't just take the latest blindly.
; NimBLE-Arduino@2.4.0 was tried here to isolate the L2CAP CoC channel
; instability (see ble_sync.cpp's L2CAPTransferCallbacks comment) -- ruled
; out as version-specific: a full device reboot (not just a channel
; disconnect) was reproduced on BOTH 2.4.0 and 2.5.0 after repeated rapid
; connect/disconnect/L2CAP-open cycles during live testing, pointing at
; accumulated resource/connection-state exhaustion (likely a leak somewhere
; in NimBLE's own connection or L2CAP channel teardown path under this
; stress pattern) rather than anything specific to one library version.
; Reverted to 2.5.0, which at least fails more gracefully (a clean channel
; disconnect with a visible error) than 2.4.0 did (silent device crash, no
; error at all) in the same testing. L2CAP CoC itself remains unresolved --
; see ble_sync.cpp for the full investigation history before trying again.
lib_deps =
    h2zero/NimBLE-Arduino@2.5.0
    ; Outbound WSS client for voice_agent.cpp's live Deepgram Voice Agent
    ; connection (Jarvis commands only, see voice_agent.cpp) -- the stock
    ; Arduino WiFiClient/HTTPClient stack has no WebSocket framing/handshake
    ; support at all. This is the actively-maintained arduinoWebSockets
    ; library (TLS via WiFiClientSecure under the hood), not an ESP-IDF-native
    ; component -- kept as a normal PlatformIO lib_dep rather than fighting
    ; the build system to pull in ESP-IDF's esp_websocket_client component
    ; under the Arduino framework.
    links2004/WebSockets@2.7.3
    ; JSON build/parse for voice_agent.cpp's Deepgram Voice Agent control
    ; messages (Settings/FunctionCallRequest/etc.) -- not used anywhere else
    ; in this firmware today.
    bblanchon/ArduinoJson@7.4.3

; V2 board: ESP32-S3-PICO-1-N8R8, 8MB flash / 8MB PSRAM (octal, in-package)
board_build.arduino.memory_type = qio_opi
board_build.flash_size = 8MB
; Dual OTA app slots for firmware auto-update -- see partitions.csv's own
; comment for why (rollback safety if a pushed update is bad).
;
; IMPORTANT: `pio run -t upload` rewrites the bootloader (0x0) and partition
; table (0x8000) on EVERY flash, in addition to the app. Confirmed live,
; twice in a row: this wipes the device's WiFi credentials and BLE pairing
; state even when partitions.csv is byte-identical to what was already
; flashed -- the firmware's own ensureNvsReady()/loadCredentials()
; (wifi_sync.cpp, face.cpp) treat a rewritten partition table as a signal
; that NVS may be stale and erase-and-reinit it, per standard ESP-IDF
; behavior. OTA pushes (Update.begin/write/end via the /ota endpoint) only
; ever touch the app0/app1 partition and have never once wiped credentials
; across many pushes. For routine firmware iteration (anything that
; doesn't actually change partitions.csv/board_build.partitions or the
; bootloader/framework version), use ./flash_app_only.sh instead -- it
; flashes only firmware.bin at 0x10000, the same region OTA already proves
; is safe. Reserve a full `pio run -t upload` for when the partition table
; itself needs to change, and expect to re-pair/reconnect afterward.
board_build.partitions = partitions.csv
board_build.psram_type = opi
board_upload.flash_size = 8MB

build_flags =
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -DCORE_DEBUG_LEVEL=3
    ; This board has no physical UART-to-USB bridge chip -- only the native
    ; USB-Serial/JTAG peripheral (confirmed in esptool's chip info: "USB
    ; mode: USB-Serial/JTAG"). Without these two flags, Arduino's Serial
    ; object defaults to UART0 on GPIO pins that go nowhere on this board,
    ; so every Serial.print/println/printf call in this codebase (80+
    ; call sites across main.cpp/wifi_sync.cpp/ble_sync.cpp) was silently
    ; producing no visible output over USB -- confirmed live: known-good
    ; boot events (BLE advertising, SD card mount) always logged via plain
    ; printf()/ESP_LOG (which do reach the USB-Serial/JTAG console by
    ; default), while Serial-based debug lines placed right next to them
    ; never appeared, even though the code paths demonstrably ran. This
    ; likely also explains why the voice_agent.cpp hang investigation
    ; (see that file's top comment) stalled on "needs a real serial
    ; monitor" -- there was nothing wrong with the monitor, Serial output
    ; itself was never reaching it.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    ; Enables NimBLE-Arduino's L2CAP Connection-Oriented Channel API
    ; (NimBLEDevice::createL2CAPServer(), etc). Without this, that API is
    ; compiled out entirely (#if CONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM in
    ; NimBLEL2CAPServer.h/NimBLEL2CAPChannel.h) -- this is the one setting
    ; Arduino IDE can't durably provide, which is why this project moved to
    ; PlatformIO. 1 channel is all ble_sync.cpp uses (a single transfer PSM).
    -DCONFIG_BT_NIMBLE_L2CAP_COC_MAX_NUM=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

extra_scripts = pre:extra_scripts/patch_sdkconfig.py
