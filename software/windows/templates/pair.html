<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pair device — Clicky Notes</title>
  <link rel="stylesheet" href="/static/design.css">
  <style>
    body { max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    .device { display: block; border: 1px solid var(--border); background: var(--card-bg); border-radius: var(--radius); padding: 0.9rem 1rem; margin-bottom: 0.75rem; cursor: pointer; }
    .device:hover { border-color: var(--accent); }
    .device input { margin-right: 0.6rem; }
    .device .addr { color: var(--muted); font-size: 0.8rem; }
    .current { color: var(--accent); font-size: 0.8rem; }
    p a { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Pair a device</h1>
  <p class="hint">Scanning for nearby devices advertising as "EpaperTranscriber*". Power the device on and reload this page if nothing shows up.</p>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  {% if devices %}
    <form method="post" action="/pair">
      <input type="hidden" name="next" value="{{ next or '/' }}">
      {% for d in devices %}
        <label class="device">
          <input type="radio" name="address" value="{{ d.address }}" {{ "checked" if d.address == current_address else "" }} required>
          {{ d.name }}
          {% if d.address == current_address %}<span class="current">(currently paired)</span>{% endif %}
          <div class="addr">{{ d.address }}</div>
        </label>
      {% endfor %}
      <button type="submit">Pair selected device</button>
    </form>
  {% endif %}

  <p><a href="{{ next or '/' }}">&larr; Back</a></p>
</body>
</html>
