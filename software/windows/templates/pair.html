<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Pair device — Clicky Notes</title>
  <link rel="stylesheet" href="/static/design.css?v={{ asset_v }}">
  <script src="/static/ble_pair.js?v={{ asset_v }}"></script>
  <style>
    body { max-width: 480px; margin: 3rem auto; padding: 0 1rem; }
    .pair-panel { border: 1px solid var(--border); background: var(--card-bg); border-radius: var(--radius); padding: 1rem 1.2rem; }
    p a { color: var(--muted); font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Pair a device</h1>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <!-- Same widget the Settings Bluetooth card mounts (static/ble_pair.js).
       Pairing normally happens inline in Settings now; this page remains for
       deep links and for anyone who lands here directly. -->
  <div class="pair-panel" id="ble-pair-widget"></div>

  <p><a href="{{ next or '/' }}">&larr; Back</a></p>

  <script>
    initBlePairing(document.getElementById("ble-pair-widget"), {
      currentAddress: {{ (current_address or "") | tojson }},
      // Server already ran one scan rendering this page -- hand those over so
      // an awake device is offered immediately rather than rescanned for.
      initialDevices: {{ devices | tojson }},
      // Unlike the Settings card, arriving HERE is an explicit request to
      // pair, so scanning starts on its own.
      autoStart: true,
    });
  </script>
</body>
</html>
