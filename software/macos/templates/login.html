<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Log in — Clicky Notes</title>
  <link rel="stylesheet" href="/static/design.css?v={{ asset_v }}">
  <style>
    body { display: flex; align-items: center; justify-content: center; height: 100vh; }
    form { border: 1px solid var(--border); border-radius: var(--radius); padding: 2rem; width: 280px; background: var(--card-bg); box-shadow: var(--shadow); }
    input { margin-bottom: 1rem; }
    button { width: 100%; margin-top: 0; }
  </style>
</head>
<body>
  <form method="post" action="/login">
    <h1>Clicky Notes</h1>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <input type="password" name="password" placeholder="Password" autofocus required>
    <button type="submit">Log in</button>
  </form>
</body>
</html>
